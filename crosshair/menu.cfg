bind "4" "cl_crosshaircolor 5; cl_crosshaircolor_b 255; cl_crosshaircolor_g 255; cl_crosshaircolor_r 255; echo Crosshair color -> WHITE"
bind "5" "cl_crosshaircolor 5; cl_crosshaircolor_b 0; cl_crosshaircolor_g 0; cl_crosshaircolor_r 0; echo Crosshair color -> BLACK"
