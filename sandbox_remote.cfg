# SANDBOX (REMOTE) - use this instead of sandbox.cfg when you are NOT the host.
# Server-wide settings below need rcon to run on someone else's server.
# You MUST authenticate first, once per connect:
#   rcon_password "the_server_password"

# BINDS
bind "MOUSE4" "noclip; echo Noclip toggled"
bind "MOUSE5" "ent_fire smokegrenade_projectile kill; stopsound; echo Smoke grenades cleared"
bind "f9" "exec custom_cfg/sandbox_remote; echo Sandbox (Remote) Menu reloaded"
bind "f11" "exec custom_cfg/main; echo Returning to Main Menu"
bind "p" "rcon bot_place; echo Bot placed (via rcon)"

# GRENADE PRACTICE (client-side, no rcon needed once sv_cheats is on)
bind "n" "give weapon_hegrenade; echo Given: HE Grenade"
bind "k" "give weapon_flashbang; echo Given: Flashbang"
bind "l" "give weapon_smokegrenade; echo Given: Smoke Grenade"
bind "t" "give weapon_incgrenade; give weapon_molotov; echo Given: Molotov/Incendiary"
bind "j" "sv_rethrow_last_grenade; echo Rethrowing last grenade"

# SERVER-WIDE SETTINGS - require rcon since you don't own this server
rcon sv_cheats 1
rcon mp_warmup_end 1
rcon mp_roundtime_defuse 60
rcon mp_roundtime 60
rcon mp_warmuptime 99999
rcon bot_kick
rcon sv_grenade_trajectory_prac_pipreview true
rcon sv_infinite_ammo 1
rcon mp_buy_anywhere 1
rcon mp_buytime 99999
rcon mp_startmoney 16000

# BOTS - server-wide, require rcon
rcon notarget
rcon bot_dont_shoot 1
rcon bot_freeze 1
rcon bot_stop 1
rcon bot_ignore_players 1

# New (client-side cheat commands, no rcon needed)
god
impulse 101

# TOGGLES (real ON/OFF state via alias)
alias "impacts_on" "sv_showimpacts 1; echo Bullet Impacts: ON; bind i impacts_off"
alias "impacts_off" "sv_showimpacts 0; echo Bullet Impacts: OFF; bind i impacts_on"
impacts_on

alias "tp_on" "thirdperson; echo Thirdperson: ON; bind z tp_off"
alias "tp_off" "firstperson; echo Thirdperson: OFF; bind z tp_on"
tp_off
bind "z" "tp_on"

echo " "
echo "================================"
echo " SANDBOX MENU (REMOTE - not host)"
echo "================================"
echo " !! Run rcon_password \"serverpass\" FIRST or rcon lines above failed silently !!"
echo " sv_cheats, god, infinite ammo, buy anywhere: sent via rcon"
echo " [MOUSE4] Noclip"
echo " [MOUSE5] Clear thrown smokes"
echo " [P]      Place bot (rcon)"
echo " [N]      Give HE Grenade"
echo " [K]      Give Flashbang"
echo " [L]      Give Smoke Grenade"
echo " [T]      Give Molotov/Incendiary"
echo " [J]      Rethrow last grenade"
echo " [I]      Toggle bullet impacts"
echo " [Z]      Toggle thirdperson"
echo " [F9]     Reload Sandbox (Remote) Menu"
echo " [F11]    Back to Main Menu"
echo "================================"
